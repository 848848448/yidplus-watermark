name: site-watermark
# yidplus.com uploads: ask https://yidplus.com/api/wm/jobs for new videos (and photos that arrived
# without the mark, e.g. from the Android app), burn "Yidplus.com" in, upload the result (it replaces
# the file in place only after it was checked). Short runs only: each run works the queue, exits as
# soon as it is empty, and never runs longer than 10 min. It never starts another run itself.
# Triggers: the */5 schedule (GitHub fires it when it fires) and workflow_dispatch (manual, or a
# debounced call from the site after a video lands - see EVENT_TRIGGER.md, not wired yet).
# Separate from watermark.yml (the control site's logo job). Logs print counts only.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: site-watermark
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (cached static build)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: Put ffmpeg on PATH (+ Pillow and a bold font for the mark)
        run: |
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -sSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C "$HOME/ffmpeg" --strip-components=1 || true
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          python3 -m pip install --quiet --disable-pip-version-check pillow || pip install --quiet pillow
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core) || true
      - name: Mark waiting uploads (exit when the queue is empty, 10 min cap)
        timeout-minutes: 11
        env:
          SITE_WM_KEY: ${{ secrets.SITE_WM_KEY }}
          # A run started by the site (workflow_dispatch) keeps looking 150 s after the queue is empty:
          # longer than the site's 2-min debounce, so an upload that skipped the call is still caught.
          WM_LOOK_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '150' || '0' }}
          WM_MAX_SECONDS: "600"
        run: python3 site_watermark.py
